<!--
  Dusty's mark: a pixel-art dustpan outline on a 16×16 grid (one unit per
  pixel), on no background: green in light mode, white in dark mode. Show
  it at multiples of 16 px so it stays sharp. (The app icons are PNGs
  drawn from this grid, green on a white tile.)

  ................
  ................
  ......####......
  ......#..#......
  ......#..#......
  ......#..#......
  ...####..####...
  ...#........#...
  ...##########...
  ..#..........#..
  ..#..........#..
  .#............#.
  .#............#.
  .##############.
  ................
  ................
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <style>
    path { fill: #16a34a; }
    @media (prefers-color-scheme: dark) { path { fill: #fff; } }
  </style>
  <path d="M6 2h4v1h-4zM6 3h1v1h-1zM9 3h1v1h-1zM6 4h1v1h-1zM9 4h1v1h-1zM6 5h1v1h-1zM9 5h1v1h-1zM3 6h4v1h-4zM9 6h4v1h-4zM3 7h1v1h-1zM12 7h1v1h-1zM3 8h10v1h-10zM2 9h1v1h-1zM13 9h1v1h-1zM2 10h1v1h-1zM13 10h1v1h-1zM1 11h1v1h-1zM14 11h1v1h-1zM1 12h1v1h-1zM14 12h1v1h-1zM1 13h14v1h-14z"/>
</svg>
